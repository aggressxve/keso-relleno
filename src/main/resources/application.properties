spring.config.import=optional:file:.env[.properties]
spring.application.name=relleno

#Configurar atributos para mi db
spring.datasource.url=jdbc:mysql://localhost:3306/keso_pasteleria?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Configuracion de la accion de JPA
spring.jpa.hibernate.ddl-auto=update

#Lineas nuevas para subir archivos de imagenes segun la IA
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Logs para ver informacion de las queries de JPA (dev)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
