<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="./images/imgFooter/kesologo.png">

    <!-- Importación de Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Outfit:wght@300;400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="contactanos.css">
    <link rel="stylesheet" href="./carrito.css">
    <title>Keso - Carrito</title>
</head>

<body>
   <div class="container my-4 carrito-container">
    <h2 class="fw-bold mb-4">Tu carrito</h2>

    <div class="row g-4">

      <!-- LISTA DE PRODUCTOS -->
      <div class="col-12 col-lg-8">
        <div id="lista-carrito" class="d-flex flex-column gap-3">
        </div>

        <p id="carrito-vacio" class="text-center text-muted py-5 d-none">
          Tu carrito está vacío. <a href="Catálogo.html">Ver catálogo</a>
        </p>
      </div>

      <!-- RESUMEN -->
      <div class="col-12 col-lg-4">
        <div class="resumen-card">
          <h3 class="fw-bold mb-3">Resumen</h3>

          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span id="resumen-subtotal">$0.00</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span>Envío</span>
            <span>Se calcula al pagar</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
            <span>Total</span>
            <span id="resumen-total">$0.00</span>
          </div>

          <button class="btn btn-cta w-100" id="btn-pagar">Pasar a pagar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="checkout-modal" class="checkout-modal" hidden>
    <section class="checkout-dialog" role="dialog" aria-modal="true" aria-labelledby="checkout-title">
      <div id="checkout-review">
        <div class="checkout-header">
          <div>
            <p class="checkout-eyebrow">Un último paso</p>
            <h2 id="checkout-title">Revisa tu compra</h2>
          </div>
          <button type="button" id="checkout-close" class="checkout-close" aria-label="Cerrar">×</button>
        </div>

        <div id="checkout-items" class="checkout-items"></div>
        <div class="checkout-total">
          <span>Total</span>
          <strong id="checkout-total">$0.00</strong>
        </div>

        <div class="checkout-profile">
          <h3>Tus datos</h3>
          <p><strong>Nombre:</strong> <span id="checkout-nombre"></span></p>
          <p><strong>Correo:</strong> <span id="checkout-email"></span></p>
          <p><strong>Teléfono:</strong> <span id="checkout-telefono"></span></p>
        </div>

        <form id="checkout-form">
          <fieldset class="checkout-fulfillment">
            <legend>¿Cómo quieres recibir tu pedido?</legend>
            <label class="checkout-option">
              <input type="radio" name="checkout-entrega" value="domicilio" checked>
              <span>Entrega a domicilio</span>
            </label>
            <label class="checkout-option">
              <input type="radio" name="checkout-entrega" value="tienda">
              <span>Recoger en tienda</span>
            </label>
          </fieldset>

          <div id="checkout-domicilio">
            <label for="checkout-direccion">Dirección de entrega</label>
            <textarea id="checkout-direccion" rows="3" required
              placeholder="Calle, número, colonia y referencias"></textarea>
          </div>

          <div class="checkout-schedule">
            <div>
              <label for="checkout-fecha">Fecha <span id="checkout-fecha-contexto">de entrega</span></label>
              <input type="date" id="checkout-fecha" required>
            </div>
            <div>
              <label for="checkout-hora">Hora <span id="checkout-hora-contexto">de entrega</span></label>
              <input type="time" id="checkout-hora" required>
            </div>
          </div>

          <div class="checkout-actions">
            <button type="button" id="checkout-cancel" class="checkout-button checkout-button-secondary">
              Cancelar
            </button>
            <button type="submit" class="checkout-button checkout-button-primary">
              Finalizar compra
            </button>
          </div>
        </form>
      </div>

      <div id="checkout-confirmation" class="checkout-confirmation" hidden>
        <div class="checkout-confirmation-icon" aria-hidden="true">✓</div>
        <p class="checkout-eyebrow">Gracias por elegir Keso</p>
        <h2>Tu solicitud está preparada</h2>
        <p id="checkout-confirmation-message"></p>
        <button type="button" id="checkout-finish" class="checkout-button checkout-button-primary">
          Volver al carrito
        </button>
      </div>
    </section>
  </div>

    <!-- Llamar navbar y footer-->
    <script src="./js/carrito.js"></script>
    <script src="./js/navbar y footer.js"></script>
    <script>cargarFooter();</script>
    <script>llamarNavbar()</script>

</body>

</html>
