<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="./images/imgFooter/kesologo.png">

    <!-- Importación de Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Outfit:wght@300;400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="contactanos.css">

    <title>Index Keso</title>
</head>

<body>
    
    <form action="/procesar-pago" method="POST" class="form-pago">
    <h2>Detalles de pago</h2>

    <div class="campo">
        <label for="nombre">Nombre del titular</label>
        <input 
        type="text" 
        id="nombre" 
        name="nombre" 
        placeholder="Como aparece en la tarjeta" 
        autocomplete="cc-name" 
        required
        >
    </div>

    <div class="campo">
        <label for="tarjeta">Número de tarjeta</label>
        <input 
        type="text" 
        id="tarjeta" 
        name="tarjeta" 
        placeholder="XXXX XXXX XXXX XXXX" 
        autocomplete="cc-number" 
        inputmode="numeric" 
        pattern="[0-9 ]+" 
        minlength="15" 
        maxlength="19" 
        required
        >
    </div>

    <div class="fila-doble">
        <div class="campo">
        <label for="expiracion">Fecha de expiración</label>
        <input 
            type="text" 
            id="expiracion" 
            name="expiracion" 
            placeholder="MM/AA" 
            autocomplete="cc-exp" 
            required
        >
        </div>

        <div class="campo">
        <label for="cvc">Código de seguridad (CVC)</label>
        <input 
            type="text" 
            inputmode="numeric" 
            id="cvc" 
            name="cvc" 
            placeholder="123" 
            autocomplete="cc-csc" 
            minlength="3" 
            maxlength="4" 
            pattern="[0-9]+" 
            required
        >
        </div>
    </div>

    <button type="submit">Pagar ahora</button>
    </form>

    
<!-- Llamar navbar y footer-->
<script src="js/navbar y footer.js"></script>
<script>cargarFooter();</script>
<script>llamarNavbar()</script>

</body>
<script src="./index.js"></script>

</html>
