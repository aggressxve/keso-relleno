<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/panel-administrativo/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/styles.css" rel="stylesheet" type="text/css">
    <link href="styleP.css" rel="stylesheet" type="text/css">
    <title>Administrar empleados - Keso</title>
</head>
<body>
<div class="app-container">
    <main class="main-content">
        <h1 id="textPanelAdmin">Administrar empleados</h1>
        <section class="container my-4">
            <div class="card p-4 mb-4">
                <h2>Dar de alta empleado</h2>
                <p>La contraseña se guardará cifrada. El empleado podrá iniciar sesión con su correo y contraseña.</p>
                <form id="form-empleado" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="empleado-nombre">Nombre</label>
                        <input class="form-control" id="empleado-nombre" name="nombre" required maxlength="255">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="empleado-correo">Correo electrónico</label>
                        <input class="form-control" id="empleado-correo" name="correo" type="email" required maxlength="255">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="empleado-contrasena">Contraseña inicial</label>
                        <input class="form-control" id="empleado-contrasena" name="contrasena"
                               type="password" autocomplete="new-password" required minlength="8">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="empleado-rol">Perfil</label>
                        <select class="form-select" id="empleado-rol" name="rol" required>
                            <option value="">Cargando perfiles...</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" id="crear-empleado" type="submit" disabled>Crear empleado</button>
                        <p id="empleado-mensaje" class="mt-3 mb-0" role="status" aria-live="polite"></p>
                    </div>
                </form>
            </div>

            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Empleados registrados</h2>
                    <button class="btn btn-outline-secondary" id="recargar-empleados" type="button">Actualizar</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                        <tr><th>Nombre</th><th>Correo</th><th>Perfil</th><th>Estado</th></tr>
                        </thead>
                        <tbody id="empleados-lista">
                        <tr><td colspan="4">Cargando empleados...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>
<script src="/js/panel opciones.js"></script>
<script>llamarPanel()</script>
<script src="empleados.js"></script>
</body>
</html>
